    <!-- Navigation Bar-->

      <!-- Menu Button -->
      <input class="menu-button" type="checkbox" id="menu-button" />
      <label
        class="hamburger"
        for="menu-button"
        aria-label="Toggle navigation menu"
        ><span class="hamburger-line" aria-hidden="true"></span
      ></label>

      <!-- Navigation Links -->
      <nav class="navbar">

      <div class="link-tree content">
        <div class="icon-link">
          <!-- LinkedIn Icon and Link -->
          <!-- <h4>LinkedIn</h4> -->
          <a
            href="https://www.linkedin.com/in/zachary-hill-5524257a/"

        <div class="icon-link">
          <!-- GitHub Icon and Link -->
          <!-- <h4>GitHub</h4> -->
          <a href="https://github.com/zachreborn" target="_blank"
            ><i class="fa-brands fa-github fa-5x"></i
          ></a>
        </div>
        <div class="icon-link">
          <!-- Discord Icon and Link -->
          <!-- <h4>Discord</h4> -->
          <a href="https://discord.com/users/reborn#4623" target="_blank"
            ><i class="fab fa-discord fa-5x"></i
          ></a>

          <a
            href="https://github.com/zachreborn"
            target="_blank"

            aria-label="GitHub"
            ><i class="fa-brands fa-github"></i

          ></a>
          <a href="architecture.html" aria-label="About this website"
            ><i class="fa-solid fa-code"></i
          ></a>
        </div>
        <p>
          <i class="fa-regular fa-copyright"></i>
          <span id="footer-year">2025</span> | Zachary Hill
        </p>
      </div>

    <script>
      document.getElementById("footer-year").textContent =
        new Date().getFullYear();

      // Close hamburger menu when a nav link is clicked
      document.querySelectorAll(".menu a").forEach((link) => {
        link.addEventListener("click", () => {
          document.getElementById("menu-button").checked = false;
        });
      });
    </script>
