---
name: Deploy - Dev
on:
  push:
    branches-ignore:
      - main
      - master
      - production
      - prod

permissions:
  contents: read

jobs:
  dev_deploy:
    name: "Dev Website Deploy"
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: ${{ github.repository }}
          persist-credentials: false

      - name: Echo directory
        run: ls -lha ${{ github.repository }}

      - name: Log event name
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          REPO_NAME: ${{ github.repository }}
        run: echo "This is the $EVENT_NAME event for branch $REF_NAME in repository $REPO_NAME."

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ vars.AWS_DEV_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy to S3
        env:
          REPO_NAME: ${{ github.repository }}
          BUCKET_NAME: ${{ vars.AWS_DEV_BUCKET_NAME }}
        run: aws s3 sync "./$REPO_NAME" "s3://$BUCKET_NAME" --delete --exclude ".git/*" --exclude ".github/*" --exclude "*.md" --exclude "LICENSE"
