---
name: Deploy - Dev
on:
  push:
    branches-ignore:
      - main
      - master
      - production
      - prod

# OIDC requires id-token: write so the job can request a short-lived token
# and assume the deployment IAM role (no long-lived AWS keys stored in repo).
permissions:
  contents: read
  id-token: write

jobs:
  dev_deploy:
    name: 'Dev Website Deploy'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ github.repository }}

      - name: Echo directory
        run: ls -lha ${{ github.repository }}

      - name: Log event name
        run: echo "This is the ${{ github.event_name }} event for branch ${{ github.ref }} in repository ${{ github.repository }}."

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_DEV_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-actions-dev-deploy

      - name: Deploy to S3
        run: aws s3 sync ./${{ github.repository }} s3://${{ vars.AWS_DEV_BUCKET_NAME }} --delete --exclude ".git/*" --exclude ".github/*" --exclude "*.md" --exclude "LICENSE"
